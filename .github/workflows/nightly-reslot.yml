name: nightly re-slotting
# Proposes re-slotting moves as work orders, checks layout drift and stock integrity. It changes no stock and no bin by itself.
# Needs a repository secret named DATABASE_URL (Settings > Secrets and variables > Actions): the same Postgres the dashboard uses.
on:
  schedule:
    - cron: "30 1 * * *"        # 01:30 UTC every night
  workflow_dispatch:             # or run it by hand from the Actions tab
jobs:
  reslot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt python-dotenv
      - run: python scripts/live_job.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
