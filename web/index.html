<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F1E8" />
    <script>
      /* apply the saved theme before first paint (no flash of the wrong theme) */
      try {
        var t = localStorage.getItem("theme");
        t = t === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Warehouse Slotting Engine: demand-aware product-to-bin assignment, tested on held-out orders." />
    <title>The Living Warehouse · Slotting Engine</title>

    <!-- Inter is loaded with a swap so text is readable immediately; system fonts are the fallback if it cannot load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
